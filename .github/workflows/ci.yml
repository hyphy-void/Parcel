name: Parcel checks
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: go test -race ./...
      - run: go vet ./...
      - name: Verify Pages gateway and build static deployment
        run: |
          npm --prefix cloudflare ci
          npm --prefix cloudflare test
          VITE_ADMIN_AUTH=access npm --prefix web run build -- --outDir ../dist/pages-web --emptyOutDir
          npm --prefix cloudflare run build
          npm --prefix cloudflare run test:runtime
      - name: Verify V3 Worker, real D1/R2 and deployment/migration tools
        run: |
          ./scripts/build-v3.sh --skip-install
          npm run test:crypto
          npm --prefix cloudflare run test:v3
          node --test scripts/tests/worker-build.test.mjs scripts/tests/v3-credentials.test.mjs
          node --test scripts/tests/guide.test.mjs
          WRANGLER_SEND_METRICS=false node cloudflare/node_modules/wrangler/bin/wrangler.js deploy --dry-run --config wrangler.json
      - run: ./scripts/release.sh --skip-web
      - name: Use AMD64 release binary for integration and browser tests
        run: |
          mkdir -p bin
          install -m 0755 dist/parcel-linux-amd64 bin/parcel
      - run: PARCEL_TEST_BINARY="$PWD/bin/parcel" npm --prefix cloudflare run test:integration
      - run: PARCEL_TEST_BINARY="$PWD/bin/parcel" python3 -m unittest discover -s scripts/tests -v
      - run: npx playwright install --with-deps chromium firefox
        working-directory: web
      - name: Verify bilingual deployment guide in Chromium
        run: node --test scripts/tests/guide-browser.test.mjs
      - run: npm run test:e2e
        working-directory: web
      - run: npm --prefix cloudflare run test:browser
      - run: npm --prefix cloudflare run test:browser:v3
      - name: Verify real browser E2EE transport, saving and login response recovery
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl libnss3-tools
          PARCEL_LOGIN_WEB_DIR="$PWD/dist/v3-web" node --test web/tests/login-response.mjs
          npm run test:e2ee:https
      - uses: actions/upload-artifact@v4
        with:
          name: parcel-linux
          path: dist/
